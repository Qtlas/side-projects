<VirtualHost *:80>
    ServerName juv.wfl.lan
    ServerAlias www.juv.wfl.lan
    DocumentRoot /var/www/juv.wfl.lan

    <Directory "/var/www/juv.wfl.lan">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/var/www/juv.wfl.lan/training">
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Restricted area for Juventus players"
        AuthUserFile /etc/apache2/htpasswd/players
        Require valid-user
    </Directory>

    <Directory "/var/www/juv.wfl.lan/tactics">
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Restricted area for the Juventus coaching staff"
        AuthUserFile /etc/apache2/htpasswd/coaches
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/juv-error.log
    CustomLog ${APACHE_LOG_DIR}/juv-access.log combined
</VirtualHost>
