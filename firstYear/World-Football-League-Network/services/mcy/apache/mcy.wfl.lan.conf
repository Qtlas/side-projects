<VirtualHost *:80>
    ServerName mcy.wfl.lan
    ServerAlias www.mcy.wfl.lan
    DocumentRoot /var/www/mcy.wfl.lan

    <Directory "/var/www/mcy.wfl.lan">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/var/www/mcy.wfl.lan/training">
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Restricted area for Manchester City players"
        AuthUserFile /etc/apache2/htpasswd/players
        Require valid-user
    </Directory>

    <Directory "/var/www/mcy.wfl.lan/tactics">
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Restricted area for the Manchester City coaching staff"
        AuthUserFile /etc/apache2/htpasswd/coaches
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/mcy-error.log
    CustomLog ${APACHE_LOG_DIR}/mcy-access.log combined
</VirtualHost>
