# ============================================================
#  SFTP chroot for Manchester City
#  Drop-in file for /etc/ssh/sshd_config.d/
#  Role accounts: sftp-players-mcy, sftp-coaches-mcy, sftp-admin-mcy
# ============================================================
Match Group sftp-mcy
    ChrootDirectory /srv/sftp/mcy/%u
    ForceCommand internal-sftp
    AllowTcpForwarding no
    X11Forwarding no
    PasswordAuthentication yes
