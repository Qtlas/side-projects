{
"Dhcp4": {
    "interfaces-config": {
        "interfaces": [ "enp0s3" ],
        "dhcp-socket-type": "raw"
    },
    "lease-database": {
        "type": "memfile",
        "persist": true,
        "name": "/var/lib/kea/kea-leases4.csv"
    },
    "valid-lifetime": 86400,
    "renew-timer": 43200,
    "rebind-timer": 75600,
    "ddns-send-updates": true,
    "ddns-override-no-update": true,
    "ddns-override-client-update": true,
    "ddns-replace-client-name": "when-not-present",
    "ddns-generated-prefix": "host",
    "ddns-qualifying-suffix": "mcy.wfl.lan",
    "dhcp-ddns": {
        "enable-updates": true,
        "server-ip": "127.0.0.1",
        "server-port": 53001,
        "sender-ip": "127.0.0.1",
        "sender-port": 0,
        "max-queue-size": 1024,
        "ncr-protocol": "UDP",
        "ncr-format": "JSON"
    },
    "subnet4": [
        {
            "id": 10,
            "subnet": "172.20.129.0/26",
            "pools": [ { "pool": "172.20.129.2 - 172.20.129.62" } ],
            "relay": { "ip-addresses": [ "172.20.129.1" ] },
            "ddns-send-updates": true,
            "ddns-qualifying-suffix": "mcy.wfl.lan",
            "option-data": [
                { "name": "routers",             "data": "172.20.129.1"   },
                { "name": "domain-name-servers", "data": "172.20.129.138" },
                { "name": "domain-name",         "data": "mcy.wfl.lan"  },
                { "name": "broadcast-address",   "data": "172.20.129.63"  },
                { "name": "ntp-servers",         "data": "172.20.128.6" }
            ]
        },
        {
            "id": 20,
            "subnet": "172.20.129.64/28",
            "pools": [ { "pool": "172.20.129.66 - 172.20.129.78" } ],
            "relay": { "ip-addresses": [ "172.20.129.65" ] },
            "ddns-send-updates": true,
            "ddns-qualifying-suffix": "mcy.wfl.lan",
            "option-data": [
                { "name": "routers",             "data": "172.20.129.65"  },
                { "name": "domain-name-servers", "data": "172.20.129.138" },
                { "name": "domain-name",         "data": "mcy.wfl.lan"  },
                { "name": "broadcast-address",   "data": "172.20.129.79"  },
                { "name": "ntp-servers",         "data": "172.20.128.6" }
            ]
        },
        {
            "id": 30,
            "subnet": "172.20.129.96/27",
            "pools": [ { "pool": "172.20.129.98 - 172.20.129.126" } ],
            "relay": { "ip-addresses": [ "172.20.129.97" ] },
            "ddns-send-updates": true,
            "ddns-qualifying-suffix": "mcy.wfl.lan",
            "option-data": [
                { "name": "routers",             "data": "172.20.129.97"  },
                { "name": "domain-name-servers", "data": "172.20.129.138" },
                { "name": "domain-name",         "data": "mcy.wfl.lan"  },
                { "name": "broadcast-address",   "data": "172.20.129.127" },
                { "name": "ntp-servers",         "data": "172.20.128.6" }
            ]
        }
    ],
    "loggers": [{
        "name": "kea-dhcp4",
        "output_options": [{
            "output": "/var/log/kea/kea-dhcp4.log",
            "maxsize": 10240000,
            "maxver": 3
        }],
        "severity": "INFO"
    }]
}
}
