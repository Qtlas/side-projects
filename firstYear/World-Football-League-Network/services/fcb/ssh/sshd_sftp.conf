# ============================================================
#  SFTP chroot for FC Barcelona
#  Drop-in file for /etc/ssh/sshd_config.d/
#  Role accounts: sftp-players-fcb, sftp-coaches-fcb, sftp-admin-fcb
# ============================================================
Match Group sftp-fcb
    ChrootDirectory /srv/sftp/fcb/%u
    ForceCommand internal-sftp
    AllowTcpForwarding no
    X11Forwarding no
    PasswordAuthentication yes
