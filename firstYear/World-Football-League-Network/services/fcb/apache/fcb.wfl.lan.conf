<VirtualHost *:80>
    ServerName fcb.wfl.lan
    ServerAlias www.fcb.wfl.lan
    DocumentRoot /var/www/fcb.wfl.lan

    <Directory "/var/www/fcb.wfl.lan">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/var/www/fcb.wfl.lan/training">
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Restricted area for FC Barcelona players"
        AuthUserFile /etc/apache2/htpasswd/players
        Require valid-user
    </Directory>

    <Directory "/var/www/fcb.wfl.lan/tactics">
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Restricted area for the FC Barcelona coaching staff"
        AuthUserFile /etc/apache2/htpasswd/coaches
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/fcb-error.log
    CustomLog ${APACHE_LOG_DIR}/fcb-access.log combined
</VirtualHost>
