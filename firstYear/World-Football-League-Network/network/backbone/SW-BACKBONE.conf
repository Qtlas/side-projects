! SW-BACKBONE, WFL backbone switch
! Layer 2 management segment on VLAN 60 Backbone-Mgmt
!
hostname SW-BACKBONE
no ip domain-lookup
ip domain-name backbone.wfl.lan
service password-encryption
no ip routing
!
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip access-list standard ACL-SSH-MGMT
 permit 172.20.128.0 0.0.0.255
 deny any log
!
vtp mode transparent
vlan 60
 name Backbone-Mgmt
vlan 666
 name BlackHole
no spanning-tree
!
interface FastEthernet0/1
 switchport mode access
 switchport access vlan 60
 switchport port-security maximum 5
 switchport port-security violation restrict
 switchport port-security
 no shutdown
!
interface FastEthernet0/2
 switchport mode access
 switchport access vlan 60
 switchport port-security maximum 5
 switchport port-security violation restrict
 switchport port-security
 no shutdown
!
interface FastEthernet0/3
 switchport mode access
 switchport access vlan 60
 switchport port-security maximum 5
 switchport port-security violation restrict
 switchport port-security
 no shutdown
!
interface FastEthernet0/4
 switchport mode access
 switchport access vlan 60
 switchport port-security maximum 5
 switchport port-security violation restrict
 switchport port-security
 no shutdown
!
interface FastEthernet0/5
 switchport mode access
 switchport access vlan 60
 switchport port-security maximum 3
 switchport port-security violation restrict
 switchport port-security
 no shutdown
!
interface FastEthernet0/6
 switchport mode access
 switchport access vlan 60
 switchport port-security maximum 5
 switchport port-security violation restrict
 switchport port-security
 no shutdown
!
interface range FastEthernet0/7 - 24
 switchport mode access
 switchport access vlan 666
 shutdown
!
interface Vlan60
 description MGMT-SSH
 ip address 172.20.128.8 255.255.255.0
 no shutdown
!
ip default-gateway 172.20.128.1
!
ntp server 172.20.128.6
ntp update-calendar
clock timezone CET 1
clock summer-time CEST recurring last Sun Mar 2:00 last Sun Oct 3:00
service timestamps log datetime msec localtime
service timestamps debug datetime msec localtime
!
line vty 0 4
 transport input ssh
 login local
 access-class ACL-SSH-MGMT in
 exec-timeout 5 0
!
line console 0
 login local
 exec-timeout 5 0
!
banner login ^
*************************************************************
* SW-BACKBONE (WFL Backbone)
* Authorized access only. All activity is logged and monitored.
*************************************************************
^
!
banner motd ^
SW-BACKBONE. Private system. Authorized access only.
^
