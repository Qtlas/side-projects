! R-EDGE, WFL backbone edge router
! Handles the Internet edge, NAT overload and the OSPF area 0 default route
!
hostname R-EDGE
no ip domain-lookup
service password-encryption
!
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
!
ip access-list standard 1
 permit 172.20.128.0 0.0.0.255
 permit 172.20.129.0 0.0.3.255
 permit 172.20.130.0 0.0.3.255
 permit 172.20.131.0 0.0.3.255
 permit 172.20.132.0 0.0.3.255
 permit 172.20.133.0 0.0.3.255
!
interface FastEthernet0/0
 description UPLINK-WAN
 ip address 172.20.255.3 255.255.255.240
 ip nat outside
 no shutdown
!
interface FastEthernet0/1
 description TO-SW-BACKBONE
 ip address 172.20.128.1 255.255.255.0
 ip ospf 1 area 0
 ip ospf priority 100
 ip nat inside
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 default-information originate always
!
ip route 0.0.0.0 0.0.0.0 FastEthernet0/0
!
ip nat inside source list 1 interface FastEthernet0/0 overload
!
ntp server 172.20.128.6
ntp update-calendar
clock timezone CET 1
clock summer-time CEST recurring last Sun Mar 2:00 last Sun Oct 3:00
service timestamps log datetime msec localtime
service timestamps debug datetime msec localtime
!
line vty 0 4
 transport input ssh
 login local
 exec-timeout 5 0
!
line console 0
 login local
 exec-timeout 5 0
!
banner login ^
*************************************************************
* R-EDGE (WFL Backbone)
* Authorized access only. All activity is logged and monitored.
*************************************************************
^
!
banner motd ^
R-EDGE. Private system. Authorized access only.
^
