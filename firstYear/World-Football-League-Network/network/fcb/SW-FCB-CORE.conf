! SW-FCB-CORE, FC Barcelona core switch (L3)
! Inter-VLAN routing, OSPF area 2 and EtherChannel to the distribution layer
!
hostname SW-FCB-CORE
no ip domain-lookup
ip domain-name fcb.wfl.lan
service password-encryption
no cdp run
no ip http server
no ip http secure-server
vtp mode transparent
ip routing
!
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip access-list standard ACL-SSH-MGMT
 permit 172.20.131.128 0.0.0.7
 deny any log
!
vlan 10
 name Players
vlan 20
 name Technical-Staff
vlan 30
 name Admin-Staff
vlan 40
 name Network-Mgmt
vlan 50
 name Servers
vlan 666
 name BlackHole
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50,666 priority 4096
!
interface range Ethernet0/0 - 1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,666
 channel-group 1 mode on
 no shutdown
!
interface Port-channel1
 description PO1-TRUNK-TO-SW-FCB-DIST1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,666
 spanning-tree guard root
 ip dhcp snooping trust
 no shutdown
!
interface range Ethernet0/2 - 3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,666
 channel-group 2 mode on
 no shutdown
!
interface Port-channel2
 description PO2-TRUNK-TO-SW-FCB-DIST2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,666
 spanning-tree guard root
 ip dhcp snooping trust
 no shutdown
!
interface Ethernet1/0
 description TO-R-FCB
 no switchport
 ip address 172.20.131.146 255.255.255.252
 ip ospf 1 area 2
 no shutdown
!
interface Ethernet1/1
 description ACCESS-VLAN50-SERVERS
 switchport mode access
 switchport access vlan 50
 switchport port-security maximum 6
 switchport port-security violation restrict
 switchport port-security
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet1/2
 shutdown
!
interface Ethernet1/3
 shutdown
!
interface Vlan10
 ip address 172.20.131.1 255.255.255.192
 no ip proxy-arp
 ip helper-address 172.20.131.138
 ip ospf 1 area 2
 no shutdown
!
interface Vlan20
 ip address 172.20.131.65 255.255.255.240
 no ip proxy-arp
 ip helper-address 172.20.131.138
 ip ospf 1 area 2
 no shutdown
!
interface Vlan30
 ip address 172.20.131.97 255.255.255.224
 no ip proxy-arp
 ip helper-address 172.20.131.138
 ip ospf 1 area 2
 no shutdown
!
interface Vlan40
 description MGMT-SSH
 ip address 172.20.131.129 255.255.255.248
 no ip proxy-arp
 ip ospf 1 area 2
 no shutdown
!
interface Vlan50
 ip address 172.20.131.137 255.255.255.248
 no ip proxy-arp
 ip ospf 1 area 2
 no shutdown
!
router ospf 1
 router-id 40.40.40.40
 passive-interface Vlan10
 passive-interface Vlan20
 passive-interface Vlan30
 passive-interface Vlan40
 passive-interface Vlan50
!
ntp server 172.20.128.6
ntp update-calendar
clock timezone CET 1
clock summer-time CEST recurring last Sun Mar 2:00 last Sun Oct 3:00
service timestamps log datetime msec localtime
service timestamps debug datetime msec localtime
!
line vty 0 4
 transport input ssh
 login local
 access-class ACL-SSH-MGMT in
 exec-timeout 5 0
!
line console 0
 login local
 exec-timeout 5 0
!
banner login ^
*************************************************************
* SW-FCB-CORE (FC Barcelona)
* Authorized access only. All activity is logged and monitored.
*************************************************************
^
!
banner motd ^
SW-FCB-CORE. Private system. Authorized access only.
^
