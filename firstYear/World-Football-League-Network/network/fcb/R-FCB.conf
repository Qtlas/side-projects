! R-FCB, FC Barcelona edge router
! Club uplink to the WFL backbone, OSPF ABR between area 0 and area 2
!
hostname R-FCB
no ip domain-lookup
service password-encryption
!
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
!
interface FastEthernet0/0
 description TO-SW-BACKBONE
 ip address 172.20.128.4 255.255.255.0
 ip ospf priority 1
 no shutdown
!
interface FastEthernet0/1
 description TO-SW-FCB-CORE
 ip address 172.20.131.145 255.255.255.252
 no shutdown
!
router ospf 1
 network 172.20.128.0 0.0.0.255 area 0
 network 172.20.131.144 0.0.0.3 area 2
!
ntp server 172.20.128.6
ntp update-calendar
clock timezone CET 1
clock summer-time CEST recurring last Sun Mar 2:00 last Sun Oct 3:00
service timestamps log datetime msec localtime
service timestamps debug datetime msec localtime
!
line vty 0 4
 transport input ssh
 login local
 exec-timeout 5 0
!
line console 0
 login local
 exec-timeout 5 0
!
banner login ^
*************************************************************
* R-FCB (FC Barcelona)
* Authorized access only. All activity is logged and monitored.
*************************************************************
^
!
banner motd ^
R-FCB. Private system. Authorized access only.
^
