<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 930" role="img" aria-label="Network topology">
  <style>
    .box   { fill:#161b22; stroke:#30363d; stroke-width:1.4; }
    .router{ fill:#161b22; stroke:#58a6ff; stroke-width:1.6; }
    .server{ fill:#161b22; stroke:#2ea043; stroke-width:1.6; }
    .inet  { fill:#1f2a3a; stroke:#58a6ff; stroke-width:1.6; }
    .vlan  { fill:#161b22; stroke:#30363d; stroke-width:1.2; stroke-dasharray:4 3; }
    .name  { fill:#e6edf3; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; font-weight:600; text-anchor:middle; }
    .sub   { fill:#8b949e; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:9.5px; text-anchor:middle; }
    .lnk   { stroke:#484f58; stroke-width:1.3; fill:none; }
    .bus   { stroke:#2ea043; stroke-width:1.6; fill:none; }
    .cap   { fill:#6e7681; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10px; }
  </style>

  <rect width="940" height="930" fill="#0d1117"/>

  <!-- ===== backbone spine ===== -->
  <line class="lnk" x1="110" y1="60"  x2="110" y2="88"/>
  <line class="lnk" x1="110" y1="134" x2="110" y2="162"/>

  <rect class="inet" x="55" y="22" width="110" height="38" rx="7"/>
  <text class="name" x="110" y="45">Internet</text>

  <rect class="router" x="45" y="88" width="130" height="46" rx="7"/>
  <text class="name" x="110" y="106">R-EDGE</text>
  <text class="sub"  x="110" y="122">NAT &#183; OSPF area 0</text>

  <rect class="box" x="25" y="162" width="170" height="46" rx="7"/>
  <text class="name" x="110" y="180">SW-BACKBONE</text>
  <text class="sub"  x="110" y="196">VLAN 60 &#183; 172.20.128.0/24</text>

  <!-- backbone bus + branch connectors -->
  <line class="bus" x1="110" y1="208" x2="110" y2="835"/>
  <line class="lnk" x1="110" y1="251" x2="250" y2="251"/>
  <line class="lnk" x1="110" y1="355" x2="250" y2="355"/>
  <line class="lnk" x1="110" y1="475" x2="250" y2="475"/>
  <line class="lnk" x1="110" y1="595" x2="250" y2="595"/>
  <line class="lnk" x1="110" y1="715" x2="250" y2="715"/>
  <line class="lnk" x1="110" y1="835" x2="250" y2="835"/>

  <!-- backbone server -->
  <rect class="server" x="250" y="228" width="170" height="46" rx="7"/>
  <text class="name" x="335" y="246">SRV-BACKBONE</text>
  <text class="sub"  x="335" y="262">DNS &#183; NTP &#183; .6</text>

  <!-- ===== site MCY ===== -->
  <g transform="translate(0,300)">
    <rect class="router" x="250" y="35" width="96" height="40" rx="7"/>
    <text class="name" x="298" y="59">R-MCY</text>
    <line class="lnk" x1="346" y1="55" x2="372" y2="55"/>
    <rect class="box" x="372" y="35" width="104" height="40" rx="7"/>
    <text class="name" x="424" y="59">SW-MCY-CORE</text>
    <line class="lnk" x1="476" y1="55" x2="500" y2="26"/>
    <line class="lnk" x1="476" y1="55" x2="500" y2="92"/>
    <rect class="box" x="500" y="8"  width="104" height="36" rx="7"/>
    <text class="name" x="552" y="30">SW-MCY-DIST1</text>
    <rect class="box" x="500" y="74" width="104" height="36" rx="7"/>
    <text class="name" x="552" y="96">SW-MCY-DIST2</text>
    <line class="lnk" x1="604" y1="26" x2="628" y2="55"/>
    <line class="lnk" x1="604" y1="92" x2="628" y2="55"/>
    <rect class="box" x="628" y="35" width="112" height="40" rx="7"/>
    <text class="name" x="684" y="59">SW-MCY-ACCESS</text>
    <line class="lnk" x1="740" y1="55" x2="762" y2="55"/>
    <rect class="vlan" x="762" y="30" width="156" height="50" rx="7"/>
    <text class="name" x="840" y="52">VLANs 10/20/30/40</text>
    <text class="sub"  x="840" y="68">+ server VLAN 50</text>
  </g>

  <!-- ===== site BVB ===== -->
  <g transform="translate(0,420)">
    <rect class="router" x="250" y="35" width="96" height="40" rx="7"/>
    <text class="name" x="298" y="59">R-BVB</text>
    <line class="lnk" x1="346" y1="55" x2="372" y2="55"/>
    <rect class="box" x="372" y="35" width="104" height="40" rx="7"/>
    <text class="name" x="424" y="59">SW-BVB-CORE</text>
    <line class="lnk" x1="476" y1="55" x2="500" y2="26"/>
    <line class="lnk" x1="476" y1="55" x2="500" y2="92"/>
    <rect class="box" x="500" y="8"  width="104" height="36" rx="7"/>
    <text class="name" x="552" y="30">SW-BVB-DIST1</text>
    <rect class="box" x="500" y="74" width="104" height="36" rx="7"/>
    <text class="name" x="552" y="96">SW-BVB-DIST2</text>
    <line class="lnk" x1="604" y1="26" x2="628" y2="55"/>
    <line class="lnk" x1="604" y1="92" x2="628" y2="55"/>
    <rect class="box" x="628" y="35" width="112" height="40" rx="7"/>
    <text class="name" x="684" y="59">SW-BVB-ACCESS</text>
    <line class="lnk" x1="740" y1="55" x2="762" y2="55"/>
    <rect class="vlan" x="762" y="30" width="156" height="50" rx="7"/>
    <text class="name" x="840" y="52">VLANs 10/20/30/40</text>
    <text class="sub"  x="840" y="68">+ server VLAN 50</text>
  </g>

  <!-- ===== site FCB ===== -->
  <g transform="translate(0,540)">
    <rect class="router" x="250" y="35" width="96" height="40" rx="7"/>
    <text class="name" x="298" y="59">R-FCB</text>
    <line class="lnk" x1="346" y1="55" x2="372" y2="55"/>
    <rect class="box" x="372" y="35" width="104" height="40" rx="7"/>
    <text class="name" x="424" y="59">SW-FCB-CORE</text>
    <line class="lnk" x1="476" y1="55" x2="500" y2="26"/>
    <line class="lnk" x1="476" y1="55" x2="500" y2="92"/>
    <rect class="box" x="500" y="8"  width="104" height="36" rx="7"/>
    <text class="name" x="552" y="30">SW-FCB-DIST1</text>
    <rect class="box" x="500" y="74" width="104" height="36" rx="7"/>
    <text class="name" x="552" y="96">SW-FCB-DIST2</text>
    <line class="lnk" x1="604" y1="26" x2="628" y2="55"/>
    <line class="lnk" x1="604" y1="92" x2="628" y2="55"/>
    <rect class="box" x="628" y="35" width="112" height="40" rx="7"/>
    <text class="name" x="684" y="59">SW-FCB-ACCESS</text>
    <line class="lnk" x1="740" y1="55" x2="762" y2="55"/>
    <rect class="vlan" x="762" y="30" width="156" height="50" rx="7"/>
    <text class="name" x="840" y="52">VLANs 10/20/30/40</text>
    <text class="sub"  x="840" y="68">+ server VLAN 50</text>
  </g>

  <!-- ===== site JUV ===== -->
  <g transform="translate(0,660)">
    <rect class="router" x="250" y="35" width="96" height="40" rx="7"/>
    <text class="name" x="298" y="59">R-JUV</text>
    <line class="lnk" x1="346" y1="55" x2="372" y2="55"/>
    <rect class="box" x="372" y="35" width="104" height="40" rx="7"/>
    <text class="name" x="424" y="59">SW-JUV-CORE</text>
    <line class="lnk" x1="476" y1="55" x2="500" y2="26"/>
    <line class="lnk" x1="476" y1="55" x2="500" y2="92"/>
    <rect class="box" x="500" y="8"  width="104" height="36" rx="7"/>
    <text class="name" x="552" y="30">SW-JUV-DIST1</text>
    <rect class="box" x="500" y="74" width="104" height="36" rx="7"/>
    <text class="name" x="552" y="96">SW-JUV-DIST2</text>
    <line class="lnk" x1="604" y1="26" x2="628" y2="55"/>
    <line class="lnk" x1="604" y1="92" x2="628" y2="55"/>
    <rect class="box" x="628" y="35" width="112" height="40" rx="7"/>
    <text class="name" x="684" y="59">SW-JUV-ACCESS</text>
    <line class="lnk" x1="740" y1="55" x2="762" y2="55"/>
    <rect class="vlan" x="762" y="30" width="156" height="50" rx="7"/>
    <text class="name" x="840" y="52">VLANs 10/20/30/40</text>
    <text class="sub"  x="840" y="68">+ server VLAN 50</text>
  </g>

  <!-- ===== site AJX ===== -->
  <g transform="translate(0,780)">
    <rect class="router" x="250" y="35" width="96" height="40" rx="7"/>
    <text class="name" x="298" y="59">R-AJX</text>
    <line class="lnk" x1="346" y1="55" x2="372" y2="55"/>
    <rect class="box" x="372" y="35" width="104" height="40" rx="7"/>
    <text class="name" x="424" y="59">SW-AJX-CORE</text>
    <line class="lnk" x1="476" y1="55" x2="500" y2="26"/>
    <line class="lnk" x1="476" y1="55" x2="500" y2="92"/>
    <rect class="box" x="500" y="8"  width="104" height="36" rx="7"/>
    <text class="name" x="552" y="30">SW-AJX-DIST1</text>
    <rect class="box" x="500" y="74" width="104" height="36" rx="7"/>
    <text class="name" x="552" y="96">SW-AJX-DIST2</text>
    <line class="lnk" x1="604" y1="26" x2="628" y2="55"/>
    <line class="lnk" x1="604" y1="92" x2="628" y2="55"/>
    <rect class="box" x="628" y="35" width="112" height="40" rx="7"/>
    <text class="name" x="684" y="59">SW-AJX-ACCESS</text>
    <line class="lnk" x1="740" y1="55" x2="762" y2="55"/>
    <rect class="vlan" x="762" y="30" width="156" height="50" rx="7"/>
    <text class="name" x="840" y="52">VLANs 10/20/30/40</text>
    <text class="sub"  x="840" y="68">+ server VLAN 50</text>
  </g>

  <text class="cap" x="25" y="915">All 5 sites share the same core / distribution / access structure.</text>
</svg>
