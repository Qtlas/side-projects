{
"DhcpDdns": {
    "ip-address": "127.0.0.1",
    "port": 53001,
    "dns-server-timeout": 500,
    "ncr-protocol": "UDP",
    "ncr-format": "JSON",
    "forward-ddns": {
        "ddns-domains": [{
            "name": "mcy.wfl.lan.",
            "dns-servers": [{ "ip-address": "127.0.0.1", "port": 53 }]
        }]
    },
    "reverse-ddns": {
        "ddns-domains": [{
            "name": "129.20.172.in-addr.arpa.",
            "dns-servers": [{ "ip-address": "127.0.0.1", "port": 53 }]
        }]
    },
    "loggers": [{
        "name": "kea-dhcp-ddns",
        "output_options": [{
            "output": "/var/log/kea/kea-ddns.log",
            "maxsize": 10240000,
            "maxver": 3
        }],
        "severity": "INFO"
    }]
}
}
