# ============================================================
#  SFTP chroot for Juventus
#  Drop-in file for /etc/ssh/sshd_config.d/
#  Role accounts: sftp-players-juv, sftp-coaches-juv, sftp-admin-juv
# ============================================================
Match Group sftp-juv
    ChrootDirectory /srv/sftp/juv/%u
    ForceCommand internal-sftp
    AllowTcpForwarding no
    X11Forwarding no
    PasswordAuthentication yes
