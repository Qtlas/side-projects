# ============================================================
#  SFTP chroot for Ajax Amsterdam
#  Drop-in file for /etc/ssh/sshd_config.d/
#  Role accounts: sftp-players-ajx, sftp-coaches-ajx, sftp-admin-ajx
# ============================================================
Match Group sftp-ajx
    ChrootDirectory /srv/sftp/ajx/%u
    ForceCommand internal-sftp
    AllowTcpForwarding no
    X11Forwarding no
    PasswordAuthentication yes
