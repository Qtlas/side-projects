<VirtualHost *:80>
    ServerName ajx.wfl.lan
    ServerAlias www.ajx.wfl.lan
    DocumentRoot /var/www/ajx.wfl.lan

    <Directory "/var/www/ajx.wfl.lan">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/var/www/ajx.wfl.lan/training">
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Restricted area for Ajax Amsterdam players"
        AuthUserFile /etc/apache2/htpasswd/players
        Require valid-user
    </Directory>

    <Directory "/var/www/ajx.wfl.lan/tactics">
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Restricted area for the Ajax Amsterdam coaching staff"
        AuthUserFile /etc/apache2/htpasswd/coaches
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ajx-error.log
    CustomLog ${APACHE_LOG_DIR}/ajx-access.log combined
</VirtualHost>
