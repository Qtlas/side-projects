# ============================================================
#  SFTP chroot for Borussia Dortmund
#  Drop-in file for /etc/ssh/sshd_config.d/
#  Role accounts: sftp-players-bvb, sftp-coaches-bvb, sftp-admin-bvb
# ============================================================
Match Group sftp-bvb
    ChrootDirectory /srv/sftp/bvb/%u
    ForceCommand internal-sftp
    AllowTcpForwarding no
    X11Forwarding no
    PasswordAuthentication yes
