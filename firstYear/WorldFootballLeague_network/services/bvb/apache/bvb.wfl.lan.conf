<VirtualHost *:80>
    ServerName bvb.wfl.lan
    ServerAlias www.bvb.wfl.lan
    DocumentRoot /var/www/bvb.wfl.lan

    <Directory "/var/www/bvb.wfl.lan">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/var/www/bvb.wfl.lan/training">
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Restricted area for Borussia Dortmund players"
        AuthUserFile /etc/apache2/htpasswd/players
        Require valid-user
    </Directory>

    <Directory "/var/www/bvb.wfl.lan/tactics">
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Restricted area for the Borussia Dortmund coaching staff"
        AuthUserFile /etc/apache2/htpasswd/coaches
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/bvb-error.log
    CustomLog ${APACHE_LOG_DIR}/bvb-access.log combined
</VirtualHost>
