! SW-AJX-DIST1, Ajax Amsterdam distribution switch (L2)
! Redundant EtherChannel between the core and the access layer
!
hostname SW-AJX-DIST1
no ip domain-lookup
ip domain-name ajx.wfl.lan
service password-encryption
no cdp run
no ip http server
no ip http secure-server
vtp mode transparent
ip default-gateway 172.20.133.129
!
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip access-list standard ACL-SSH-MGMT
 permit 172.20.133.128 0.0.0.7
 deny any log
!
vlan 10
 name Players
vlan 20
 name Technical-Staff
vlan 30
 name Admin-Staff
vlan 40
 name Network-Mgmt
vlan 50
 name Servers
vlan 666
 name BlackHole
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50,666 priority 8192
!
interface range Ethernet0/0 - 1
 channel-group 1 mode on
 no shutdown
!
interface Port-channel1
 description PO1-TRUNK-TO-SW-AJX-CORE
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,666
 no shutdown
!
interface range Ethernet0/2 - 3
 channel-group 2 mode on
 no shutdown
!
interface Port-channel2
 description PO2-TRUNK-TO-SW-AJX-ACCESS
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,666
 spanning-tree guard root
 ip dhcp snooping trust
 no shutdown
!
interface Ethernet1/0
 shutdown
!
interface Ethernet1/1
 shutdown
!
interface Ethernet1/2
 shutdown
!
interface Ethernet1/3
 shutdown
!
interface Vlan40
 description MGMT-SSH
 ip address 172.20.133.130 255.255.255.248
 no shutdown
!
ntp server 172.20.128.6
ntp update-calendar
clock timezone CET 1
clock summer-time CEST recurring last Sun Mar 2:00 last Sun Oct 3:00
service timestamps log datetime msec localtime
service timestamps debug datetime msec localtime
!
line vty 0 4
 transport input ssh
 login local
 access-class ACL-SSH-MGMT in
 exec-timeout 5 0
!
line console 0
 login local
 exec-timeout 5 0
!
banner login ^
*************************************************************
* SW-AJX-DIST1 (Ajax Amsterdam)
* Authorized access only. All activity is logged and monitored.
*************************************************************
^
!
banner motd ^
SW-AJX-DIST1. Private system. Authorized access only.
^
