! SW-JUV-ACCESS, Juventus access switch (L2)
! End-host ports with port-security and DHCP snooping
!
hostname SW-JUV-ACCESS
no ip domain-lookup
ip domain-name juv.wfl.lan
service password-encryption
no cdp run
no ip http server
no ip http secure-server
vtp mode transparent
ip default-gateway 172.20.132.129
!
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip access-list standard ACL-SSH-MGMT
 permit 172.20.132.128 0.0.0.7
 deny any log
!
vlan 10
 name Players
vlan 20
 name Technical-Staff
vlan 30
 name Admin-Staff
vlan 40
 name Network-Mgmt
vlan 50
 name Servers
vlan 666
 name BlackHole
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50,666 priority 61440
!
ip dhcp snooping
ip dhcp snooping vlan 10,20,30
no ip dhcp snooping information option
!
interface range Ethernet0/0 - 1
 channel-group 1 mode on
 no shutdown
!
interface Port-channel1
 description PO1-TRUNK-TO-SW-JUV-DIST1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,666
 ip dhcp snooping trust
 no shutdown
!
interface range Ethernet0/2 - 3
 channel-group 2 mode on
 no shutdown
!
interface Port-channel2
 description PO2-TRUNK-TO-SW-JUV-DIST2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,666
 ip dhcp snooping trust
 no shutdown
!
interface Ethernet1/0
 description ACCESS-VLAN20-TECH-STAFF
 switchport mode access
 switchport access vlan 20
 switchport port-security maximum 15
 switchport port-security violation restrict
 switchport port-security
 spanning-tree portfast
 spanning-tree guard root
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet1/1
 description ACCESS-VLAN30-ADMIN-STAFF
 switchport mode access
 switchport access vlan 30
 switchport port-security maximum 15
 switchport port-security violation restrict
 switchport port-security
 spanning-tree portfast
 spanning-tree guard root
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet1/2
 description ACCESS-VLAN10-PLAYERS
 switchport mode access
 switchport access vlan 10
 switchport port-security maximum 15
 switchport port-security violation restrict
 switchport port-security
 spanning-tree portfast
 spanning-tree guard root
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet1/3
 description ACCESS-VLAN10-PLAYERS-2
 switchport mode access
 switchport access vlan 10
 switchport port-security maximum 15
 switchport port-security violation restrict
 switchport port-security
 spanning-tree portfast
 spanning-tree guard root
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet2/0
 description ACCESS-VLAN40-NETWORK-MGMT
 switchport mode access
 switchport access vlan 40
 switchport port-security maximum 15
 switchport port-security violation restrict
 switchport port-security
 spanning-tree portfast
 spanning-tree guard root
 spanning-tree bpduguard enable
 no shutdown
!
interface range Ethernet2/1 - 3
 switchport mode access
 switchport access vlan 666
 shutdown
!
interface range Ethernet3/0 - 3
 switchport mode access
 switchport access vlan 666
 shutdown
!
interface Vlan40
 description MGMT-SSH
 ip address 172.20.132.132 255.255.255.248
 no shutdown
!
ntp server 172.20.128.6
ntp update-calendar
clock timezone CET 1
clock summer-time CEST recurring last Sun Mar 2:00 last Sun Oct 3:00
service timestamps log datetime msec localtime
service timestamps debug datetime msec localtime
!
line vty 0 4
 transport input ssh
 login local
 access-class ACL-SSH-MGMT in
 exec-timeout 5 0
!
line console 0
 login local
 exec-timeout 5 0
!
banner login ^
*************************************************************
* SW-JUV-ACCESS (Juventus)
* Authorized access only. All activity is logged and monitored.
*************************************************************
^
!
banner motd ^
SW-JUV-ACCESS. Private system. Authorized access only.
^
